name: Box3Converter
options:
  deploymentTarget:
    iOS: "16.0"
packages:
  ConverterCore:
    path: ../ConverterCore
targets:
  Box3Converter:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
    dependencies:
      - package: ConverterCore
        product: ConverterCore
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.swapp.converter
      PRODUCT_NAME: Swapp
      SWIFT_VERSION: "5.0"
      TARGETED_DEVICE_FAMILY: "1,2"
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_CFBundleDisplayName: Swapp
      INFOPLIST_KEY_UIFileSharingEnabled: YES
      INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
      CODE_SIGN_STYLE: Manual
      CODE_SIGNING_ALLOWED: NO
      ENABLE_BITCODE: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Box3Converter:
    build:
      targets:
        Box3Converter: all
