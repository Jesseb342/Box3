name: Nusa BC7 ASTC regression

on:
  push:
    branches: [nusa-a16-bc-host]
    paths:
      - "dm/gfx/tex/**"
      - ".github/workflows/nusa-bc7-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bc7-astc:
    name: BC7 software-to-ASTC quality regression
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install astcenc
        run: |
          curl -L --fail --silent --show-error \
            https://github.com/ARM-software/astc-encoder/releases/download/5.7.1/astcenc-5.7.1-macos-universal.zip \
            -o "$RUNNER_TEMP/astcenc.zip"
          echo "cb2dd75e33fcc12ebaae9e2230649e30da10c152b029a6d2f3440f6d45ed5c45  $RUNNER_TEMP/astcenc.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/astcenc"
          unzip -q "$RUNNER_TEMP/astcenc.zip" -d "$RUNNER_TEMP/astcenc"
          ASTCENC_BIN="$(find "$RUNNER_TEMP/astcenc" -type f -name astcenc -print -quit)"
          test -n "$ASTCENC_BIN"
          chmod +x "$ASTCENC_BIN"
          echo "ASTCENC_BIN=$ASTCENC_BIN" >> "$GITHUB_ENV"
      - name: Build BC7 ASTC test
        run: |
          mkdir -p logs
          make -C dm/gfx/tex/tests t_bc2astc 2>&1 | tee logs/build.log
      - name: Run BC7 ASTC quality regression
        run: |
          ASTCENC="$ASTCENC_BIN" dm/gfx/tex/tests/t_bc2astc 2>&1 | tee logs/bc7-astc.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: Nusa-BC7-ASTC-regression-logs
          path: logs
          retention-days: 7
