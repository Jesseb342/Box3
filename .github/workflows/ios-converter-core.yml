name: iOS converter core tests
on:
  push:
    branches: [ios-on-device-converter]
    paths: ["dm/ios/ConverterCore/**", "dm/ios/Rust/**", "dm/ios/ConverterApp/**", ".github/workflows/ios-converter-core.yml"]
  pull_request:
    branches: [ios-on-device-converter]
    paths: ["dm/ios/ConverterCore/**", "dm/ios/Rust/**", "dm/ios/ConverterApp/**", ".github/workflows/ios-converter-core.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-converter-core-${{ github.ref }}
  cancel-in-progress: false
jobs:
  swift-tests:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Rust toolchain
        run: |
          rustc --version
          cargo --version
      - name: Test vendored NSO loader and rewriter
        run: cargo test --manifest-path dm/ios/Rust/Cargo.toml --workspace
      - name: Build Rust static libraries for macOS host
        run: |
          cargo build --manifest-path dm/ios/Rust/Cargo.toml --release -p box3-nso-bridge
          cargo build --manifest-path dm/ios/Rust/Cargo.toml --release -p box3-rewrite-bridge
          cargo build --manifest-path dm/ios/Rust/Cargo.toml --release -p box3-macho-bridge
      - name: Build Rust static libraries for physical iOS devices
        run: |
          rustup target add aarch64-apple-ios
          cargo build --manifest-path dm/ios/Rust/Cargo.toml --release --target aarch64-apple-ios -p box3-nso-bridge
          cargo build --manifest-path dm/ios/Rust/Cargo.toml --release --target aarch64-apple-ios -p box3-rewrite-bridge
          cargo build --manifest-path dm/ios/Rust/Cargo.toml --release --target aarch64-apple-ios -p box3-macho-bridge
      - name: Install Swift 6.2 toolchain
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.2.0"
      - name: Verify Swift version
        run: swift --version
      - name: Run native converter core tests
        run: swift test --package-path dm/ios/ConverterCore
      - name: Select Xcode 26.3 (Swift 6.2)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate standalone converter app project
        run: xcodegen generate --spec dm/ios/ConverterApp/project.yml --project dm/ios/ConverterApp
      - name: Build unsigned Swapp diagnostic app
        run: |
          xcodebuild -project dm/ios/ConverterApp/Box3Converter.xcodeproj -scheme Box3Converter -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/swapp-derived" CODE_SIGNING_ALLOWED=NO build
          mkdir -p "$RUNNER_TEMP/swapp-ipa/Payload"
          cp -R "$RUNNER_TEMP/swapp-derived/Build/Products/Release-iphoneos/Swapp.app" "$RUNNER_TEMP/swapp-ipa/Payload/"
          cd "$RUNNER_TEMP/swapp-ipa"
          ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/Swapp-Diagnostic.ipa"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Swapp-Diagnostic-IPA
          path: ${{ runner.temp }}/Swapp-Diagnostic.ipa
          if-no-files-found: error
          retention-days: 7
