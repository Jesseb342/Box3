
name: Patrick's Parabox - Updated IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout working nxnative revision
        uses: actions/checkout@v4
        with:
          ref: d158df611bf2f3fa315c4f16585575cdfdb2a1d3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd spirv-cross
          python -m pip install --upgrade pip
          python -m pip install \
            lz4 capstone fonttools backports.zstd gdown

      - name: Download base game, update, and keys
        env:
          GAME_URL: ${{ secrets.Game_URL }}
          UPDATE_URL: ${{ secrets.Update_URL }}
          KEYS_URL: ${{ secrets.Keys_URL }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/parabox"
          mkdir -p "$WORK"

          download_file() {
            local url="$1"
            local output="$2"
            local file_id

            if [[ -z "$url" ]]; then
              echo "::error::A required URL secret is empty."
              exit 1
            fi

            file_id="$(python - "$url" <<'PY'
          import re
          import sys
          from urllib.parse import urlparse, parse_qs

          url = sys.argv[1].strip()
          parsed = urlparse(url)
          query = parse_qs(parsed.query)
          file_id = None

          if parsed.netloc.lower() in (
              "drive.google.com",
              "www.drive.google.com",
          ):
              match = re.search(r"/file/d/([^/]+)", parsed.path)
              if match:
                  file_id = match.group(1)
              elif query.get("id"):
                  file_id = query["id"][0]

          if not file_id and re.fullmatch(
              r"[-A-Za-z0-9_]{20,}", url
          ):
              file_id = url

          if not file_id:
              raise SystemExit(
                  "Could not extract a Google Drive file ID "
                  "from the supplied URL."
              )

          print(file_id)
          PY
            )"

            echo "Downloading $(basename "$output") from Google Drive..."
            gdown "$file_id" -O "$output"

            if [[ ! -s "$output" ]]; then
              echo "::error::Downloaded file is empty: $(basename "$output")"
              exit 1
            fi
          }

          download_file "$GAME_URL" "$WORK/base.nsp"
          download_file "$UPDATE_URL" "$WORK/update.nsp"
          download_file "$KEYS_URL" "$WORK/prod.keys"

          python - "$WORK" <<'PY'
          import sys
          from pathlib import Path

          folder = Path(sys.argv[1])

          for name in ("base.nsp", "update.nsp"):
              path = folder / name
              with path.open("rb") as f:
                  magic = f.read(4)

              if magic != b"PFS0":
                  raise SystemExit(
                      f"{name} is not a valid NSP container. "
                      "Check the Google Drive link, permissions, "
                      "and downloaded file."
                  )

              print(f"{name}: NSP container verified")

          keys = folder / "prod.keys"

          if keys.stat().st_size == 0:
              raise SystemExit("The keys file is empty.")

          print("Keys file downloaded; contents not displayed.")
          PY

          chmod 600 "$WORK/prod.keys"

      - name: Prepare local input folder
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/parabox"
          GAME_DIR="$RUNNER_TEMP/Parabox"

          mkdir -p "$GAME_DIR"
          cp "$WORK/base.nsp" "$GAME_DIR/base.nsp"
          cp "$WORK/update.nsp" "$GAME_DIR/update.nsp"

      - name: Build IPA with base game and update
        shell: bash
        run: |
          set -euo pipefail

          python scripts/build_ipa_from_nsp.py \
            "$RUNNER_TEMP/Parabox" \
            -k "$RUNNER_TEMP/parabox/prod.keys" \
            -o "$RUNNER_TEMP/PatricksParabox-Updated.ipa"

          test -s "$RUNNER_TEMP/PatricksParabox-Updated.ipa"

      - name: Upload updated IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PatricksParabox-Updated-IPA
          path: ${{ runner.temp }}/PatricksParabox-Updated.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build logs if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PatricksParabox-Build-Logs
          path: ${{ runner.temp }}/Parabox/*_build/logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up downloaded files and keys
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/parabox" "$RUNNER_TEMP/Parabox"
