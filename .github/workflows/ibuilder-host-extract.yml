name: Verify and extract iBuilder iOS host

on:
  workflow_dispatch:
  push:
    branches: [ios-on-device-converter]
    paths:
      - .github/workflows/ibuilder-host-extract.yml

permissions:
  contents: read

jobs:
  extract-host:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out Swapp assembler sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download the pinned official iBuilder release
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/swapp-host"
          mkdir -p "$WORK/out"
          IPA="$WORK/GameApp-rust-20261122-144325-rust7d81008a.ipa"
          URL="https://github.com/Absenti/iBuilder/releases/download/v0.1.2/GameApp-rust-20261122-144325-rust7d81008a.ipa"
          curl --fail --location --retry 3 "$URL" --output "$IPA"
          echo "812162fa910190a3dfd52c90d27fbfd5c72e2b4a7a34abb5fc554bc49bbcc9f3  $IPA" | shasum -a 256 --check
          echo "Official release IPA SHA-256 verified."
          unzip -Z1 "$IPA" | grep -Fx "Payload/GameApp.app/host-prebuilt.dylib"
          unzip -p "$IPA" "Payload/GameApp.app/host-prebuilt.dylib" > "$WORK/out/host-prebuilt-loadable-ios.dylib"
          test -s "$WORK/out/host-prebuilt-loadable-ios.dylib"
          # Preserve the complete matching player app, not just its host dylib.
          # The framework must be assembled against the exact host shipped in this player template.
          mkdir -p "$WORK/out/player-template"
          unzip -q "$IPA" "Payload/GameApp.app/*" -d "$WORK/out/player-template"
          TEMPLATE="$WORK/out/player-template/Payload/GameApp.app"
          test -s "$TEMPLATE/GameApp"
          test -s "$TEMPLATE/Info.plist"
          test -s "$TEMPLATE/host-prebuilt.dylib"
          plutil -lint "$TEMPLATE/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$TEMPLATE/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$TEMPLATE/Info.plist"

      - name: Validate the extracted host against the tagged source pins
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/swapp-host"
          HOST="$WORK/out/host-prebuilt-loadable-ios.dylib"
          EXPECTED_SHA="a66bf16265c9d743a30196efb069a595574ccd8d2c9160e1d35dae907be45b52"
          EXPECTED_SIZE="6825256"
          RAW_SHA="$(shasum -a 256 "$HOST" | awk '{print $1}')"
          ACTUAL_SIZE="$(stat -f '%z' "$HOST")"
          UNSIGNED="$WORK/out/host-prebuilt-loadable-ios-unsigned.dylib"
          cp "$HOST" "$UNSIGNED"
          if codesign -dv "$HOST" >/dev/null 2>&1; then
            codesign --remove-signature "$UNSIGNED"
            echo "Removed the IPA's embedded Mach-O code signature from the working host copy."
          else
            echo "The extracted host has no removable code signature."
          fi
          ACTUAL_SHA="$(shasum -a 256 "$UNSIGNED" | awk '{print $1}')"
          if [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]; then
            PIN_MATCH="yes"
            echo "Unsigned host matches the exact app/inputs.tsv SHA-256 pin."
          else
            PIN_MATCH="no"
            echo "::warning::Even after removing any code signature, the released IPA host does not match app/inputs.tsv. Raw SHA-256: $RAW_SHA; unsigned SHA-256: $ACTUAL_SHA; expected: $EXPECTED_SHA. Continuing only to inspect binary compatibility."
          fi
          if [ "$ACTUAL_SIZE" != "$EXPECTED_SIZE" ]; then
            echo "::warning::Raw host size differs from app/inputs.tsv: actual $ACTUAL_SIZE; expected $EXPECTED_SIZE."
          fi
          lipo "$UNSIGNED" -verify_arch arm64
          PLATFORM="$(otool -l "$UNSIGNED" | awk '/LC_BUILD_VERSION/{seen=1;next} seen && /platform/{print $2;exit}')"
          MINOS="$(otool -l "$UNSIGNED" | awk '/LC_BUILD_VERSION/{seen=1;next} seen && /minos/{print $2;exit}')"
          test "$PLATFORM" = "2" || { echo "::error::Expected iOS platform 2, got $PLATFORM"; exit 1; }
          test "$MINOS" = "26.0" || { echo "::error::Expected minimum iOS 26.0, got $MINOS"; exit 1; }
          STRINGS="$WORK/host-strings.txt"
          SYMBOLS="$WORK/host-symbols.txt"
          strings -a "$UNSIGNED" > "$STRINGS"
          nm -gU "$UNSIGNED" > "$SYMBOLS"
          grep -qx "b24b25240cad" "$STRINGS"
          # These four are the host entry points required by the Rust boot path.
          # Touch-pad entry points are optional and older hosts explicitly log when absent.
          for symbol in dm_host_probe_boot dm_front_set_layer nvn_live_set nvn_live_ready; do
            grep -qE " [A-Za-z] _${symbol}$" "$SYMBOLS" || { echo "::error::Missing required host export: $symbol"; exit 1; }
          done
          for symbol in dm_front_pad_create dm_front_pad_layout dm_front_pad_layout_tv dm_front_tv_attached dm_game_menu; do
            if grep -qE " [A-Za-z] _${symbol}$" "$SYMBOLS"; then
              echo "Optional host export present: $symbol"
            else
              echo "Optional host export absent: $symbol"
            fi
          done
          echo "Required host exports verified: dm_host_probe_boot, dm_front_set_layer, nvn_live_set, nvn_live_ready"
          echo "Full exported host symbol list:"
          cat "$SYMBOLS"
          cat > "$WORK/out/HOST-MANIFEST.txt" <<EOF
          Source: Absenti/iBuilder v0.1.2
          Release IPA: GameApp-rust-20261122-144325-rust7d81008a.ipa
          Release IPA SHA-256: 812162fa910190a3dfd52c90d27fbfd5c72e2b4a7a34abb5fc554bc49bbcc9f3
          Extracted path: Payload/GameApp.app/host-prebuilt.dylib
          Raw IPA host SHA-256: $RAW_SHA
          Unsigned host SHA-256: $ACTUAL_SHA
          Raw host size: $ACTUAL_SIZE bytes
          Matches app/inputs.tsv host pin after signature removal: $PIN_MATCH (expected SHA-256 $EXPECTED_SHA; expected size $EXPECTED_SIZE bytes)
          Architecture: arm64
          Mach-O platform: $PLATFORM (iOS)
          Minimum iOS: $MINOS
          Shader chain: b24b25240cad
          Required host exports: 4 boot-path exports checked; optional touch-pad exports reported separately
          Source pin: app/inputs.tsv at iBuilder v0.1.2
          Host provenance: prebuilt NXNative/NX2Apple engine with the iBuilder v0.1.2 pinned patch set.
          Validation: release IPA digest, host digest, byte size, architecture, platform, deployment target, shader-chain marker and required boot-path exports checked in CI; optional touch-pad exports reported separately.
          
          This is a verified released binary, not a reproducible source build. Keep the upstream iBuilder, NXNative, NX2Apple and third-party license notices with any redistribution. The host has not yet been proven compatible with Swapp's module/profile outputs or booted from a Swapp-generated framework.
          EOF
          cat "$WORK/out/HOST-MANIFEST.txt"

      - name: Assemble synthetic modules onto the candidate host
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/swapp-host"
          HOST="$WORK/out/host-prebuilt-loadable-ios-unsigned.dylib"
          OUTPUT="$WORK/out/synthetic-DmGameProbe.framework.dylib"
          cargo run --manifest-path dm/ios/Rust/Cargo.toml -p ibuilder-macho --example assemble_host_candidate -- "$HOST" "$OUTPUT" "sw" "main" "sdk" "subsdk0"
          test -s "$OUTPUT"
          lipo "$OUTPUT" -verify_arch arm64
          file "$OUTPUT"
          otool -hv "$OUTPUT"
          otool -l "$OUTPUT" > "$WORK/assembled-load-commands.txt"
          grep -q "__dmswmainx0" "$WORK/assembled-load-commands.txt"
          grep -q "__dmswsdkx0" "$WORK/assembled-load-commands.txt"
          grep -q "__dmswsubsdk0x0" "$WORK/assembled-load-commands.txt"
          nm -gU "$OUTPUT" > "$WORK/assembled-symbols.txt"
          for symbol in dm_host_probe_boot dm_front_set_layer nvn_live_set nvn_live_ready; do
            grep -qE " [A-Za-z] _${symbol}$" "$WORK/assembled-symbols.txt" || { echo "::error::Assembled framework lost required host export: $symbol"; exit 1; }
          done
          echo "Synthetic assembly output validated. This proves the assembler can lay out modules on this host; it does not prove a game-specific framework boots."

      - name: Verify player template and framework use the identical host binary
        shell: bash
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/swapp-host"
          TEMPLATE="$WORK/out/player-template/Payload/GameApp.app"
          TEMPLATE_HOST="$TEMPLATE/host-prebuilt.dylib"
          WORKING_HOST="$WORK/out/host-prebuilt-loadable-ios-unsigned.dylib"
          TEMPLATE_COPY="$WORK/out/template-host-unsigned.dylib"
          cp "$TEMPLATE_HOST" "$TEMPLATE_COPY"
          if codesign -dv "$TEMPLATE_COPY" >/dev/null 2>&1; then codesign --remove-signature "$TEMPLATE_COPY"; fi
          cmp "$TEMPLATE_COPY" "$WORKING_HOST"
          TEMPLATE_EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$TEMPLATE/Info.plist")"
          test -s "$TEMPLATE/$TEMPLATE_EXECUTABLE"
          TEMPLATE_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$TEMPLATE/Info.plist")"
          cat > "$WORK/out/PLAYER-TEMPLATE-MANIFEST.txt" <<EOF
          Template source: Absenti/iBuilder v0.1.2 official release IPA
          Release IPA SHA-256: 812162fa910190a3dfd52c90d27fbfd5c72e2b4a7a34abb5fc554bc49bbcc9f3
          Template app path: player-template/Payload/GameApp.app
          Bundle identifier: $TEMPLATE_BUNDLE_ID
          Executable: $TEMPLATE_EXECUTABLE
          Host path: host-prebuilt.dylib
          Host identity: exact byte-for-byte match after removing the app's Mach-O signature
          Host unsigned SHA-256: $(shasum -a 256 "$TEMPLATE_COPY" | awk '{print $1}')
          Export behavior: full player export embeds ExportedGame/extract/RomFS.img; no slim/external RomFS mode permitted
          BC status: this template is not accepted as A15-ready until the user's proven NXNative BC fallback is integrated and verified in the complete runtime.
          EOF
          cat "$WORK/out/PLAYER-TEMPLATE-MANIFEST.txt"

      - name: Upload verified host input and synthetic assembly
        uses: actions/upload-artifact@v4
        with:
          name: Swapp-iOS-Host-Candidate
          path: ${{ runner.temp }}/swapp-host/out/
          if-no-files-found: error
          retention-days: 7
